<ion-content>
  <recepcionist-header></recepcionist-header>
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="active-reserve-receptionist-content">
                <div class="info-check">
                    <p class="description-check">Revisa el estado<br> de los productos</p>
                    <img (click)="this.location.back()" src="../../../../../assets/images/Vector 16.png">
                    <p class="title-check mt-5">Valor daños:</p>
                    <p class="mb-3 text-danger">Se cobrará el monto de multa según el valor y estado de cada producto.</p>
                    <div class="row mt-3" *ngFor="let damageInfo of damageTable;">
                      <div class="col-6 text-start">
                        {{damageInfo.code}}: {{damageInfo.name}}
                      </div>
                      <div class="col-6 text-end">
                        ({{damageInfo.percent}}% de multa)
                      </div>
                    </div>
                </div>
                <ng-container *ngFor="let room of rooms; index as i;">
                  <p class="mt-5 text-center">{{room.detalle_sala.tipo_sala.descripcion}}</p>
                  <div class="info-table">
                      <table class="table table-striped">
                          <tbody>
                              <tr>
                                <div class="" *ngFor="let product of room.detalle_sala.tipo_sala.detalle_producto; index as i" [ngClass]="{'checklist-table-grey' : i % 2 !== 0}">
                                  <div class="row">
                                    <div class="col-6 my-auto">
                                      <p class="part">{{product.producto.nombre}} {{product.id_detalle}}</p>
                                    </div>
                                    <div class="col-6 text-center">
                                      <label for="customRange2" class="form-label">Daños (1-6)</label>
                                      <ion-range mode="md" min="1" max="6" step="1" [(ngModel)]="product.producto.estado.id"></ion-range>
                                      <label for="customRange2" class="form-label">{{product.producto.estado.id}}</label>
                                    </div>
                                  </div>
                                </div>
                              </tr>
                          </tbody>
                      </table>
                  </div>
                </ng-container>
                <button type="button" class="btn-save mt-3 mb-5" (click)="saveProductsAlert('¿Estás seguro?')">Guardar</button>
            </div>
        </div>
    </div>
</div>

</ion-content>
